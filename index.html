<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<title>Metro Cuadrado | Demo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#2563eb;--primary-hover:#1d4ed8;--primary-light:#dbeafe;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --bg:#f8fafc;--surface:#fff;--border:#e2e8f0;
  --text:#1e293b;--text-muted:#64748b;--text-light:#94a3b8;
  --sidebar-bg:#0f172a;--sidebar-text:#cbd5e1;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-full:9999px;
  --sh-sm:0 1px 2px rgba(0,0,0,.05);--sh-md:0 4px 6px -1px rgba(0,0,0,.08);--sh-lg:0 10px 25px -3px rgba(0,0,0,.1);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px} /* 16px evita zoom en iOS */
a{text-decoration:none;color:inherit}

/* ============ LOGIN ============ */
.login-view{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:var(--sp-lg)}
.login-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:420px;overflow:hidden}
.login-header{padding:var(--sp-xl) var(--sp-xl) var(--sp-lg);text-align:center}
.login-header .logo{font-size:56px;margin-bottom:var(--sp-md)}
.login-header h1{font-size:24px;font-weight:700;margin-bottom:var(--sp-xs)}
.login-header p{color:var(--text-muted);font-size:14px;line-height:1.4}
.login-body{padding:0 var(--sp-xl) var(--sp-xl)}
.login-note{text-align:center;font-size:12px;color:var(--text-light);margin-top:var(--sp-md)}

/* ============ BOTONES ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-sm);padding:10px 18px;font-size:14px;font-weight:600;border:none;border-radius:var(--r-sm);transition:all .2s;white-space:nowrap;background:transparent;color:var(--text);min-height:40px;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-ghost{border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--bg)}
.btn-google{background:#fff;color:#333;border:1px solid var(--border);width:100%;padding:14px;font-size:15px;box-shadow:var(--sh-sm);min-height:48px}
.btn-google:hover{box-shadow:var(--sh-md)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;min-height:32px}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}

/* ============ LAYOUT APP ============ */
.app-view{display:none;height:100vh;height:100dvh;overflow:hidden}
.app-view.active{display:flex}

/* ============ SIDEBAR ============ */
.sidebar{width:260px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s ease;z-index:200}
.sidebar-header{display:flex;align-items:center;gap:var(--sp-sm);padding:var(--sp-lg);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.logo-small{font-size:24px}
.brand{font-size:18px;font-weight:700;color:#fff;white-space:nowrap}
.sidebar-nav{flex:1;padding:var(--sp-md);display:flex;flex-direction:column;gap:var(--sp-xs);overflow-y:auto;-webkit-overflow-scrolling:touch}
.nav-item{display:flex;align-items:center;gap:var(--sp-md);padding:12px 14px;border-radius:var(--r-sm);color:var(--sidebar-text);font-size:14px;font-weight:500;transition:all .2s;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;min-height:44px}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-icon{font-size:18px;width:24px;text-align:center}
.sidebar-footer{padding:var(--sp-md);border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.user-info{display:flex;align-items:center;gap:var(--sp-sm);margin-bottom:var(--sp-md)}
.user-avatar{width:36px;height:36px;border-radius:var(--r-full);background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:600;flex-shrink:0}
.user-details{display:flex;flex-direction:column;min-width:0;flex:1}
.user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:11px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Backdrop para móvil */
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:150;opacity:0;transition:opacity .25s ease}
.sidebar-backdrop.active{display:block;opacity:1}

/* ============ MAIN CONTENT ============ */
.main-content{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--sp-sm);padding:0 var(--sp-lg);flex-shrink:0}
.menu-toggle{display:none;align-items:center;justify-content:center;background:none;border:none;padding:8px;font-size:22px;color:var(--text);min-width:44px;min-height:44px;border-radius:var(--r-sm);-webkit-tap-highlight-color:transparent;cursor:pointer}
.menu-toggle:active{background:var(--bg)}
.page-title{font-size:18px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.topbar-actions{display:flex;gap:var(--sp-sm);align-items:center;flex-shrink:0}
.demo-badge{background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--r-full);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.content{flex:1;padding:var(--sp-lg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ============ VIEWS ============ */
.view{display:none}
.view.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ============ STATS ============ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-md);margin-bottom:var(--sp-lg)}
.stat-card{background:var(--surface);border-radius:var(--r-md);padding:var(--sp-md) var(--sp-lg);display:flex;align-items:center;gap:var(--sp-md);box-shadow:var(--sh-sm);border:1px solid var(--border);min-width:0}
.stat-icon{width:44px;height:44px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--primary-light)}
.stat-icon.green{background:#d1fae5}
.stat-icon.orange{background:#fed7aa}
.stat-icon.purple{background:#e9d5ff}
.stat-icon.red{background:#fee2e2}
.stat-info{display:flex;flex-direction:column;min-width:0;flex:1}
.stat-label{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-value{font-size:22px;font-weight:700;color:var(--text);line-height:1.2}

/* ============ CARDS ============ */
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh-sm);border:1px solid var(--border);overflow:hidden;margin-bottom:var(--sp-lg)}
.card-header{padding:var(--sp-md) var(--sp-lg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-md);flex-wrap:wrap}
.card-header h3{font-size:15px;font-weight:600}
.card-body{padding:var(--sp-lg)}
.header-actions{display:flex;gap:var(--sp-sm);align-items:center;flex-wrap:wrap}

/* ============ CHARTS ============ */
.charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:var(--sp-md);margin-bottom:var(--sp-lg)}
.chart-wrapper{position:relative;height:280px;min-height:220px}

/* ============ TABLAS ============ */
.table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-sm);border:1px solid var(--border);position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
thead{background:var(--bg)}
th{text-align:left;padding:12px 16px;font-weight:600;color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;padding:4px 10px;font-size:11px;font-weight:600;border-radius:var(--r-full);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.badge-success{background:#d1fae5;color:#065f46}
.badge-warning{background:#fed7aa;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:var(--primary-light);color:#1e40af}
.badge-secondary{background:#e2e8f0;color:#475569}

/* ============ INPUTS ============ */
.input,input[type="search"],input[type="date"],input[type="number"],select{width:100%;padding:10px 14px;font-size:16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);transition:all .2s;min-height:44px}
.input:focus,input[type="search"]:focus,input[type="date"]:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
textarea.input{resize:vertical;min-height:80px}

/* ============ FORM ============ */
.form{display:flex;flex-direction:column;gap:var(--sp-md)}
.form-group{display:flex;flex-direction:column;gap:var(--sp-xs);min-width:0}
.form-group label{font-size:13px;font-weight:600}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--sp-md)}
.form-hint{font-size:12px;color:var(--text-muted);line-height:1.4}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .2s;z-index:2000;padding:var(--sp-md)}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:640px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;transform:scale(.95);transition:transform .2s}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:var(--sp-md) var(--sp-lg);border-bottom:1px solid var(--border);flex-shrink:0}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:18px;color:var(--text-muted);padding:8px 12px;border-radius:var(--r-sm);min-width:44px;min-height:44px;-webkit-tap-highlight-color:transparent}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:var(--sp-lg);overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.modal-footer{display:flex;justify-content:flex-end;gap:var(--sp-sm);padding:var(--sp-md) var(--sp-lg);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}

/* ============ TOASTS ============ */
.toast-container{position:fixed;top:var(--sp-lg);right:var(--sp-lg);left:var(--sp-lg);display:flex;flex-direction:column;gap:var(--sp-sm);z-index:3000;pointer-events:none;align-items:flex-end}
.toast{background:var(--surface);padding:14px 18px;border-radius:var(--r-sm);box-shadow:var(--sh-lg);border-left:4px solid var(--info);min-width:200px;max-width:420px;width:100%;font-size:14px;animation:slideIn .3s ease;pointer-events:auto;word-wrap:break-word}
.toast-success{border-left-color:var(--success)}
.toast-error{border-left-color:var(--danger)}
.toast-warning{border-left-color:var(--warning)}
@keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ============ MISC ============ */
.empty-state{padding:var(--sp-xl) var(--sp-md);text-align:center;color:var(--text-muted);font-size:14px}
.empty-icon{font-size:48px;margin-bottom:var(--sp-md);opacity:.8}
.muted-sm{color:var(--text-light);font-size:12px}
.teaser{background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);border:1px solid var(--primary-light);border-radius:var(--r-md);padding:var(--sp-lg);margin-top:var(--sp-lg)}
.teaser h3{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:var(--sp-md);display:flex;align-items:center;gap:var(--sp-sm)}
.teaser ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-sm);font-size:13px}
.teaser li{padding:var(--sp-xs) 0;color:var(--text)}
.teaser li::before{content:"🔒 ";font-size:12px}

/* ============================================================
   RESPONSIVE - TABLET (≤ 1024px)
   ============================================================ */
@media (max-width: 1024px) {
  .charts-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}

/* ============================================================
   RESPONSIVE - MOBILE (≤ 900px)
   ============================================================ */
@media (max-width: 900px) {
  /* Sidebar como drawer */
  .menu-toggle{display:flex}
  .sidebar{position:fixed;top:0;left:0;height:100vh;height:100dvh;transform:translateX(-100%);width:280px}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 30px rgba(0,0,0,.4)}
  
  /* Topbar compacta */
  .topbar{padding:0 var(--sp-md);height:56px}
  .page-title{font-size:17px}
  .content{padding:var(--sp-md)}
  
  /* Stats grid */
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:var(--sp-sm)}
  .stat-card{padding:12px 14px;gap:10px}
  .stat-icon{width:38px;height:38px;font-size:18px;border-radius:8px}
  .stat-value{font-size:20px}
  .stat-label{font-size:10px}
  
  /* Cards */
  .card-header{padding:12px var(--sp-md)}
  .card-body{padding:var(--sp-md)}
  
  /* Charts */
  .chart-wrapper{height:240px;min-height:200px}
  
  /* Tablas - scroll horizontal con hint */
  .table-wrapper{border-radius:var(--r-sm);-webkit-overflow-scrolling:touch;position:relative}
  .table-wrapper::after{content:"";position:absolute;top:0;right:0;bottom:0;width:16px;background:linear-gradient(to right,rgba(255,255,255,0),rgba(255,255,255,.85));pointer-events:none;border-radius:0 var(--r-sm) var(--r-sm) 0}
  table{min-width:600px}
  th,td{padding:10px 12px;font-size:13px}
  
  /* Modales como bottom sheet */
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92vh;max-width:100%}
  .modal-body{padding:var(--sp-md)}
  .modal-footer{padding:12px var(--sp-md);flex-direction:column-reverse}
  .modal-footer .btn{width:100%;min-height:44px}
  
  /* Header actions verticales */
  .header-actions{width:100%}
  .header-actions .btn{flex:1;min-width:0}
  .header-actions select,.header-actions input[type="search"]{flex:1;max-width:none;min-width:0}
  
  /* Toasts */
  .toast-container{top:var(--sp-md);right:var(--sp-md);left:var(--sp-md)}
  .toast{max-width:100%;width:100%}
  
  /* Form rows se apilan en móvil */
  .form-row{grid-template-columns:1fr}
}

/* ============================================================
   RESPONSIVE - SMALL PHONE (≤ 480px)
   ============================================================ */
@media (max-width: 480px) {
  .login-view{padding:var(--sp-md)}
  .login-header{padding:var(--sp-xl) var(--sp-lg) var(--sp-md)}
  .login-header .logo{font-size:48px;margin-bottom:12px}
  .login-header h1{font-size:22px}
  .login-header p{font-size:13px}
  .login-body{padding:0 var(--sp-lg) var(--sp-xl)}
  
  .stats-grid{grid-template-columns:1fr 1fr;gap:var(--sp-xs)}
  .stat-card{padding:10px 12px;gap:8px}
  .stat-icon{width:32px;height:32px;font-size:14px;border-radius:6px}
  .stat-value{font-size:17px}
  .stat-label{font-size:9px;letter-spacing:.2px}
  
  .page-title{font-size:15px}
  .demo-badge{display:none}
  .btn-sm{padding:6px 8px;font-size:11px}
  
  .card-header h3{font-size:14px}
  .chart-wrapper{height:220px}
  
  .teaser{padding:var(--sp-md)}
  .teaser ul{grid-template-columns:1fr;gap:4px;font-size:12px}
  .teaser h3{font-size:14px}
}

/* ============================================================
   TOUCH IMPROVEMENTS (siempre)
   ============================================================ */
*{-webkit-tap-highlight-color:transparent}
@media (hover: none) {
  .btn:hover:not(:disabled){background:inherit}
  .btn-primary:hover:not(:disabled){background:var(--primary)}
  .btn-ghost:hover:not(:disabled){background:transparent}
  tbody tr:hover{background:inherit}
  .nav-item:hover{background:inherit;color:var(--sidebar-text)}
  .nav-item.active:hover{background:var(--primary);color:#fff}
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login-view" class="login-view">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">🏗️</div>
      <h1>Metro Cuadrado</h1>
      <p>Sistema de Gestión de Stands, Tarimas y Eventos</p>
    </div>
    <div class="login-body">
      <button class="btn btn-google" onclick="App.login()">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Entrar al Demo
      </button>
      <p class="login-note">Versión de demostración · Datos ficticios</p>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app-view" class="app-view">
  <!-- Backdrop para móvil -->
  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="App.closeSidebar()"></div>
  
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-small">🏗️</div>
      <span class="brand">Metro Cuadrado</span>
    </div>
    <nav class="sidebar-nav" id="nav">
      <div class="nav-item" data-view="dashboard"><span class="nav-icon">📊</span><span>Dashboard</span></div>
      <div class="nav-item" data-view="productos"><span class="nav-icon">📦</span><span>Productos</span></div>
      <div class="nav-item" data-view="eventos"><span class="nav-icon">🎪</span><span>Eventos</span></div>
      <div class="nav-item" data-view="movimientos"><span class="nav-icon">🔄</span><span>Movimientos</span></div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">MC</div>
        <div class="user-details">
          <span class="user-name">Modo Demo</span>
          <span class="user-email">demo@metrocuadrado.co</span>
        </div>
      </div>
      <button class="btn btn-ghost btn-block" onclick="App.logout()" style="color:#cbd5e1;border-color:#1e293b">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="menu-toggle" onclick="App.toggleSidebar()" aria-label="Abrir menú">☰</button>
      <h2 class="page-title" id="page-title">Dashboard</h2>
      <div class="topbar-actions">
        <span class="demo-badge">Demo</span>
        <button class="btn btn-ghost btn-sm" onclick="App.resetDemo()" title="Restablecer datos">🔄</button>
      </div>
    </header>

    <div class="content">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-productos" class="view"></section>
      <section id="view-eventos" class="view"></section>
      <section id="view-movimientos" class="view"></section>
      <section id="view-evento-detalle" class="view"></section>
    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
/* =====================================================================

const Store = {
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ const d = JSON.parse(raw); if(d.products && d.events && d.movements) return d; }
    }catch(e){}
    const fresh = JSON.parse(JSON.stringify(SEED));
    this.save(fresh);
    return fresh;
  },
  save(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); },
  reset(){ localStorage.removeItem(STORAGE_KEY); }
};

const state = {
  products: [], events: [], movements: [],
  currentView: 'dashboard',
  productSearch: '', eventFilter: '', moveFilter: '',
  charts: {}
};

const $ = id => document.getElementById(id);
const money = n => '$' + Number(n||0).toLocaleString('es-CO');
const fmtDate = d => { if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return isNaN(dt) ? d : dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtDateTime = d => { if(!d) return '—'; const dt = new Date(d); return isNaN(dt) ? d : dt.toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); };
const uid = p => p + '-' + Date.now().toString(36).toUpperCase().slice(-4) + Math.random().toString(36).slice(2,5).toUpperCase();
const findProd = id => state.products.find(p => String(p.id) === String(id));
const eventTotal = e => e.lineas.reduce((s,l) => s + (l.cantidad * l.precio), 0);
const persist = () => Store.save({ products: state.products, events: state.events, movements: state.movements });

function toast(msg, type='info', duration=3500){
  const c = $('toast-container');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(() => el.remove(), 300); }, duration);
}

function badgeEstado(estado){
  const m = { 'Pendiente':'badge-warning', 'En Progreso':'badge-info', 'Finalizado':'badge-success', 'Cancelado':'badge-danger' };
  return `<span class="badge ${m[estado] || 'badge-secondary'}">${estado}</span>`;
}

function addMovement({ idProducto, tipo, cantidad, stockAntes, stockDespues, motivo, referencia }){
  state.movements.unshift({
    id: uid('MOV'),
    fecha: new Date().toISOString(),
    idProducto, tipo, cantidad, stockAntes, stockDespues, motivo, referencia: referencia || ''
  });
}

const Modal = {
  root: null,
  open({ title, body, footer }){
    this.close();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay open';
    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-header"><h3>${title}</h3><button class="modal-close" data-close aria-label="Cerrar">✕</button></div>
        <div class="modal-body">${body}</div>
        <div class="modal-footer">${footer}</div>
      </div>`;
    document.body.appendChild(overlay);
    this.root = overlay;
    overlay.querySelector('[data-close]').onclick = () => this.close();
    overlay.addEventListener('click', e => { if(e.target === overlay) this.close(); });
    document.body.style.overflow = 'hidden';
    return overlay;
  },
  close(){ 
    if(this.root){ this.root.remove(); this.root = null; document.body.style.overflow = ''; }
  }
};

const VIEW_TITLES = {
  dashboard:'Dashboard', productos:'Productos', eventos:'Eventos',
  movimientos:'Movimientos', 'evento-detalle':'Detalle del Evento'
};

function navigate(view, param){
  state.currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const v = $('view-' + view); if(v) v.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
  $('page-title').textContent = VIEW_TITLES[view] || 'Metro Cuadrado';
  // Cerrar sidebar en móvil
  if(window.innerWidth <= 900) App.closeSidebar();
  if(view === 'dashboard') renderDashboard();
  if(view === 'productos') renderProductos();
  if(view === 'eventos') renderEventos();
  if(view === 'movimientos') renderMovimientos();
  if(view === 'evento-detalle') renderEventoDetalle(param);
  // Scroll al top
  const content = document.querySelector('.content');
  if(content) content.scrollTop = 0;
}

function renderUpcomingEvents(){
  const upcoming = state.events.filter(e => e.estado === 'Pendiente' || e.estado === 'En Progreso')

  if(upcoming.length === 0) return '<div class="empty-state"><div class="empty-icon">🎪</div><p>Sin eventos próximos</p></div>';
  return `
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Cliente</th><th>Inicio</th><th>Estado</th><th>Total</th><th></th></tr></thead>
        <tbody>
          ${upcoming.map(e => `
            <tr>
              <td><strong>${e.cliente}</strong></td>
              <td>${fmtDate(e.fechaInicio)}</td>
              <td>${badgeEstado(e.estado)}</td>
              <td>${money(eventTotal(e))}</td>
              <td><button class="btn btn-sm btn-ghost" onclick="App.viewEvent('${e.id}')">Ver →</button></td>

function renderLowStock(lowStock){
  if(lowStock.length === 0) return '<div class="empty-state"><div class="empty-icon">✅</div><p>Todo el stock está en orden</p></div>';
  return `
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Producto</th><th>Stock</th><th>Mín.</th><th>Estado</th></tr></thead>
        <tbody>
          ${lowStock.map(p => {
            const agotado = Number(p.stock) <= 0;
            return `<tr>
              <td><strong>${p.nombre}</strong></td>
              <td>${p.stock}</td>
              <td>${p.stockMin}</td>
              <td><span class="badge ${agotado?'badge-danger':'badge-warning'}">${agotado?'Agotado':'Bajo'}</span></td>
            </tr>`;
          }).join('')}
        </tbody>

}

function renderChartsDashboard(){
  const monthMap = {};
  state.events.forEach(e => {
    if(!e.fechaInicio) return;
    const d = new Date(e.fechaInicio + 'T00:00:00');
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    monthMap[key] = (monthMap[key]||0) + 1;
  });
  const labels = Object.keys(monthMap).sort();
  const data = labels.map(k => monthMap[k]);
  const labelFmt = labels.map(k => {
    const [y,m] = k.split('-');
    return new Date(y, m-1, 1).toLocaleDateString('es-CO',{month:'short'});
  });
  if(state.charts.events) state.charts.events.destroy();
  state.charts.events = new Chart($('chart-events'), {
    type:'bar',
    data:{ labels: labelFmt.length ? labelFmt : ['Sin datos'], datasets:[{ label:'Eventos', data: data.length ? data : [0], backgroundColor:'#2563eb', borderRadius:6 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{precision:0,font:{size:11}}}} }
  });

  const byEstado = { Pendiente:0, 'En Progreso':0, Finalizado:0, Cancelado:0 };
  state.events.forEach(e => { if(byEstado[e.estado] !== undefined) byEstado[e.estado]++; });
  if(state.charts.estado) state.charts.estado.destroy();
  state.charts.estado = new Chart($('chart-estado'), {
    type:'doughnut',
    data:{ labels:['Pendiente','En Progreso','Finalizado'], datasets:[{ data:[byEstado.Pendiente, byEstado['En Progreso'], byEstado.Finalizado], backgroundColor:['#f59e0b','#3b82f6','#10b981'], borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12,padding:8}}}, cutout:'65%' }
  });
}

  const q = state.productSearch.toLowerCase();
  const list = state.products.filter(p => {
    if(!q) return true;
    return (p.nombre||'').toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q) || (p.categoria||'').toLowerCase().includes(q);
  });

  $('view-productos').innerHTML = `
    <div class="card">
      <div class="card-header">
        <h3>Catálogo (${list.length})</h3>
        <div class="header-actions">
          <input type="search" placeholder="🔍 Buscar…" value="${state.productSearch}" oninput="App.searchProducts(this.value)" />
          <button class="btn btn-primary" onclick="App.openProductForm()">＋ Nuevo</button>
        </div>
      </div>
      <div class="card-body">
        ${list.length === 0 
          ? '<div class="empty-state"><div class="empty-icon">📦</div><p>Sin productos. Crea el primero.</p></div>'

function renderProductsTable(list){
  return `
    <div class="table-wrapper">
      <table>
        <thead><tr><th>SKU</th><th>Nombre</th><th>Categoría</th><th>Tipo</th><th>Stock</th><th>Precio</th><th>Precio Alq.</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>
          ${list.map(p => {
            const agotado = Number(p.stock) <= 0;
            const bajo = Number(p.stock) <= Number(p.stockMin);
            const badge = agotado ? 'badge-danger' : bajo ? 'badge-warning' : 'badge-success';
            const estado = agotado ? 'Agotado' : bajo ? 'Bajo' : 'Disponible';
            return `<tr>
              <td><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:12px">${p.sku || '—'}</code></td>
              <td><strong>${p.nombre}</strong></td>
              <td>${p.categoria || '—'}</td>
              <td><span class="badge ${p.tipo==='Alquiler'?'badge-warning':'badge-info'}">${p.tipo}</span></td>
              <td>${p.stock}</td>
              <td>${money(p.precio)}</td>
              <td>${p.precioAlquiler ? money(p.precioAlquiler) : '—'}</td>
              <td><span class="badge ${badge}">${estado}</span></td>
              <td>
                <button class="btn btn-sm btn-ghost" onclick="App.openProductForm('${p.id}')" title="Editar">✏️</button>
                <button class="btn btn-sm btn-danger" onclick="App.confirmDeleteProduct('${p.id}')" title="Eliminar">🗑</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

function openProductForm(id){
  const editing = !!id;
  const p = editing ? findProd(id) : { nombre:'',sku:'',categoria:'',tipo:'Alquiler',stock:0,stockMin:0,precio:0,precioAlquiler:0 };
  if(editing && !p){ toast('Producto no encontrado','error'); return; }
  const body = `
    <form id="product-form" class="form">
      <div class="form-row">
        <div class="form-group"><label>Nombre *</label><input name="nombre" class="input" required value="${p.nombre||''}" /></div>
        <div class="form-group"><label>SKU</label><input name="sku" class="input" value="${p.sku||''}" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Tipo *</label>
          <select name="tipo" class="input">
            <option value="Alquiler" ${p.tipo==='Alquiler'?'selected':''}>Alquiler (Retornable)</option>
            <option value="Venta" ${p.tipo==='Venta'?'selected':''}>Venta (Consumible)</option>
          </select>
        </div>
        <div class="form-group"><label>Categoría</label><input name="categoria" class="input" value="${p.categoria||''}" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Stock actual</label><input name="stock" type="number" min="0" class="input" value="${p.stock||0}" /></div>
        <div class="form-group"><label>Stock mínimo</label><input name="stockMin" type="number" min="0" class="input" value="${p.stockMin||0}" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Precio Venta</label><input name="precio" type="number" min="0" class="input" value="${p.precio||0}" /></div>
        <div class="form-group"><label>Precio Alquiler</label><input name="precioAlquiler" type="number" min="0" class="input" value="${p.precioAlquiler||0}" /></div>
      </div>
    </form>`;
  const footer = `<button class="btn btn-ghost" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>${editing?'Guardar':'Crear'}</button>`;
  const modal = Modal.open({ title: editing?'Editar producto':'Nuevo producto', body, footer });
  modal.querySelector('[data-cancel]').onclick = () => Modal.close();
  modal.querySelector('[data-save]').onclick = () => {
    const form = $('product-form');
    if(!form.reportValidity()) return;
    const d = Object.fromEntries(new FormData(form).entries());
    d.stock = Number(d.stock); d.stockMin = Number(d.stockMin);
    d.precio = Number(d.precio); d.precioAlquiler = Number(d.precioAlquiler);
    if(editing){ Object.assign(p, d); toast('Producto actualizado','success'); }
    else { state.products.push({ id: uid('P'), ...d }); toast('Producto creado','success'); }
    persist(); Modal.close(); renderProductos();
  };
}

function confirmDeleteProduct(id){
  const p = findProd(id); if(!p) return;
  const modal = Modal.open({
    title:'Eliminar producto',
    body:`<p>¿Eliminar <strong>${p.nombre}</strong>?</p>`,
    footer:`<button class="btn btn-ghost" data-cancel>Cancelar</button><button class="btn btn-danger" data-ok>Eliminar</button>`
  });
  modal.querySelector('[data-cancel]').onclick = () => Modal.close();
  modal.querySelector('[data-ok]').onclick = () => {
    state.products = state.products.filter(x => x.id !== id);
    persist(); Modal.close(); toast('Producto eliminado','success'); renderProductos();
  };
}

          </select>
          <button class="btn btn-primary" onclick="App.openEventForm()">＋ Nuevo</button>
        </div>
      </div>
      <div class="card-body">
        ${sorted.length === 0
          ? '<div class="empty-state"><div class="empty-icon">🎪</div><p>Sin eventos. Crea el primero.</p></div>'
          : renderEventsTable(sorted)}
      </div>
    </div>
  `;
}

function renderEventsTable(list){
  return `
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Cliente</th><th>Inicio</th><th>Estado</th><th>Total</th><th>Acciones</th></tr></thead>
        <tbody>
          ${list.map(e => `
            <tr>
              <td><strong>${e.cliente}</strong><br><span class="muted-sm">${e.notas || ''}</span></td>
              <td>${fmtDate(e.fechaInicio)}</td>
              <td>${badgeEstado(e.estado)}</td>
              <td><strong>${money(eventTotal(e))}</strong></td>
              <td><button class="btn btn-sm btn-primary" onclick="App.viewEvent('${e.id}')">Ver →</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function openEventForm(){
  const prods = state.products.filter(p => Number(p.stock) > 0);
  if(prods.length === 0){ toast('Crea productos primero','warning'); return; }
  
  const body = `
    <form id="event-form" class="form">
      <div class="form-group"><label>Cliente *</label><input name="cliente" class="input" required placeholder="Ej: Boda García-López" /></div>
      <div class="form-row">
        <div class="form-group"><label>Fecha Inicio *</label><input name="fechaInicio" type="date" class="input" required /></div>
        <div class="form-group"><label>Fecha Fin *</label><input name="fechaFin" type="date" class="input" required /></div>
      </div>
      <div class="form-group"><label>Notas</label><input name="notas" class="input" placeholder="Detalles del montaje" /></div>
      
      <div style="border-top:1px solid var(--border); padding-top:16px;">
        <label style="font-weight:600; margin-bottom:8px; display:block;">Materiales</label>
        <div id="evt-lines" style="margin-bottom:12px"></div>
        
        <div style="background:var(--bg); padding:12px; border-radius:8px; border:1px solid var(--border);">
          <div class="form-group" style="margin-bottom:8px">
            <label>Producto</label>
            <select id="evt-add-prod" class="input">
              <option value="">— Selecciona —</option>
              ${prods.map(p => `<option value="${p.id}" data-precio-alq="${p.precioAlquiler}" data-precio-venta="${p.precio}" data-stock="${p.stock}">${p.nombre} (${p.stock})</option>`).join('')}
            </select>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Tipo</label>
              <select id="evt-add-tipo" class="input">
                <option value="Alquiler">Alquiler</option>
                <option value="Venta">Venta</option>
              </select>
            </div>
            <div class="form-group"><label>Cant.</label><input id="evt-add-cant" type="number" min="1" class="input" placeholder="0" /></div>
            <div class="form-group"><label>Precio</label><input id="evt-add-precio" type="number" min="0" class="input" value="0" /></div>
          </div>
          <button type="button" class="btn btn-primary btn-block" id="evt-add-btn" style="margin-top:8px">＋ Añadir material</button>
        </div>
      </div>
    </form>`;
  const footer = `<button class="btn btn-ghost" data-cancel>Cancelar</button><button class="btn btn-primary" data-save>Crear evento</button>`;
  const modal = Modal.open({ title:'Nuevo evento', body, footer });

  let lineas = [];
  const renderLines = () => {
    const c = $('evt-lines');
    if(lineas.length === 0){ c.innerHTML = '<p class="muted-sm" style="padding:8px;text-align:center;background:var(--bg);border-radius:6px">Aún no hay materiales</p>'; return; }
    c.innerHTML = `
      <div class="table-wrapper">
        <table style="font-size:12px;min-width:0">
          <thead><tr><th>Prod.</th><th>Tipo</th><th>Cant.</th><th>Precio</th><th></th></tr></thead>
          <tbody>
            ${lineas.map((l,i) => {
              const p = findProd(l.idProducto);
              return `<tr>
                <td>${p.nombre}</td>
                <td><span class="badge ${l.tipo==='Alquiler'?'badge-warning':'badge-info'}">${l.tipo.substring(0,3)}</span></td>
                <td>${l.cantidad}</td>
                <td>${money(l.precio)}</td>
                <td><button type="button" class="btn btn-sm btn-danger" data-rm="${i}">✕</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
    c.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { lineas.splice(Number(b.dataset.rm),1); renderLines(); });
  };
  renderLines();

  const selProd = $('evt-add-prod');
  const selTipo = $('evt-add-tipo');
  const inpPrecio = $('evt-add-precio');
  const inpCant = $('evt-add-cant');

  const updatePrice = () => {
    if(!selProd.value) return;
    const opt = selProd.options[selProd.selectedIndex];
    inpPrecio.value = selTipo.value === 'Alquiler' ? (opt.dataset.precioAlq || 0) : (opt.dataset.precioVenta || 0);
  };
  selProd.onchange = updatePrice;
  selTipo.onchange = updatePrice;

  modal.querySelector('#evt-add-btn').onclick = () => {
    if(!selProd.value || Number(inpCant.value) < 1){ toast('Selecciona producto y cantidad','warning'); return; }
    const opt = selProd.options[selProd.selectedIndex];
    const cant = Number(inpCant.value);
    if(cant > Number(opt.dataset.stock)){ toast(`Solo hay ${opt.dataset.stock} en stock`,'error'); return; }
    lineas.push({ idProducto: selProd.value, cantidad: cant, precio: Number(inpPrecio.value) || 0, tipo: selTipo.value });
    selProd.value = ''; inpCant.value = ''; inpPrecio.value = 0;
    renderLines();
  };

  modal.querySelector('[data-cancel]').onclick = () => Modal.close();
  modal.querySelector('[data-save]').onclick = () => {
    const form = $('event-form');
    if(!form.reportValidity()) return;
    if(lineas.length === 0){ toast('Añade al menos un material','warning'); return; }
    const d = Object.fromEntries(new FormData(form).entries());
    state.events.push({ id: uid('EVT'), cliente: d.cliente, fechaInicio: d.fechaInicio, fechaFin: d.fechaFin, estado: 'Pendiente', notas: d.notas, lineas });
    persist(); Modal.close();
    toast('Evento creado','success');
    if(state.currentView === 'eventos') renderEventos();
    else navigate('eventos');
  };
}

/* ============ DETALLE EVENTO ============ */
function viewEvent(id){
  navigate('evento-detalle', id);
}

function renderEventoDetalle(id){
  const evt = state.events.find(e => e.id === id);
  const container = $('view-evento-detalle');
  if(!evt){
    container.innerHTML = '<div class="card"><div class="card-body"><div class="empty-state">Evento no encontrado</div></div></div>';
    return;
  }

  const rows = evt.lineas.map(l => {
    const p = findProd(l.idProducto);
    return `<tr>
      <td>${p ? p.nombre : l.idProducto}</td>
      <td><span class="badge ${l.tipo==='Alquiler'?'badge-warning':'badge-info'}">${l.tipo}</span></td>
      <td>${l.cantidad}</td>
      <td>${money(l.precio)}</td>
      <td>${money(l.cantidad * l.precio)}</td>
    </tr>`;
  }).join('');

  let actions = '';
  if(evt.estado === 'Pendiente'){
    actions = `<button class="btn btn-primary btn-block" onclick="App.despacharEvento('${evt.id}')">🚚 Despachar material</button>`;
  } else if(evt.estado === 'En Progreso'){
    actions = `<button class="btn btn-success btn-block" onclick="App.openDevolucion('${evt.id}')">📥 Recibir devolución</button>`;
  }

  container.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header" style="flex-direction:column;align-items:stretch;gap:12px">
        <div>
          <h3 style="font-size:18px">${evt.cliente}</h3>
          <p class="muted-sm">${evt.id} · ${fmtDate(evt.fechaInicio)} → ${fmtDate(evt.fechaFin)}</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          ${badgeEstado(evt.estado)}
          ${actions}
          <button class="btn btn-ghost btn-sm" onclick="App.viewEventList()">← Volver</button>
        </div>
      </div>
      <div class="card-body">
        <p><strong>Notas:</strong> ${evt.notas || 'Sin notas'}</p>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3>Materiales y facturación</h3></div>
      <div class="card-body">
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5" class="empty-state">Sin materiales</td></tr>'}</tbody>
          </table>
        </div>
        <div style="text-align:right; margin-top:16px; padding-top:16px; border-top:1px solid var(--border)">
          <span class="muted-sm">Total facturado</span>
          <h3 style="color:var(--primary);font-size:22px">${money(eventTotal(evt))}</h3>
        </div>
      </div>
    </div>`;
}

function despacharEvento(id){
  const evt = state.events.find(e => e.id === id);
  if(!evt) return;
  const faltantes = [];
  evt.lineas.forEach(l => {
    const p = findProd(l.idProducto);
    if(!p || Number(p.stock) < l.cantidad) faltantes.push(p ? p.nombre : l.idProducto);
  });
  if(faltantes.length > 0){ toast('Stock insuficiente: ' + faltantes.join(', '),'error',6000); return; }
  evt.lineas.forEach(l => {
    const p = findProd(l.idProducto);
    if(!p) return;
    const antes = Number(p.stock);
    p.stock = antes - l.cantidad;
    addMovement({ idProducto: p.id, tipo: 'Salida', cantidad: l.cantidad, stockAntes: antes, stockDespues: p.stock, motivo: 'Despacho: ' + evt.cliente, referencia: evt.id });
  });
  evt.estado = 'En Progreso';
  persist();
  toast(`✅ Despachado. Stock actualizado`,'success',4000);
  renderEventoDetalle(id);
}

function openDevolucion(id){
  const evt = state.events.find(e => e.id === id);
  if(!evt) return;
  const rows = evt.lineas.map((l,i) => {
    const p = findProd(l.idProducto);
    const isAlq = l.tipo === 'Alquiler';
    return `<tr>
      <td>${p ? p.nombre : l.idProducto}</td>
      <td>${l.cantidad}</td>
      <td>${isAlq ? `<input type="number" class="input dev-input" data-idx="${i}" value="${l.cantidad}" min="0" max="${l.cantidad}" style="width:80px;padding:8px;min-height:40px" />` : '<span class="muted-sm">—</span>'}</td>
      <td><span class="badge ${isAlq?'badge-warning':'badge-info'}">${l.tipo}</span></td>
    </tr>`;
  }).join('');
  const body = `
    <p class="form-hint" style="margin-bottom:12px">Cantidad real devuelta. La diferencia en <b>Alquiler</b> = <b>merma</b>.</p>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Producto</th><th>Desp.</th><th>Dev.</th><th>Tipo</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  const footer = `<button class="btn btn-ghost" data-cancel>Cancelar</button><button class="btn btn-success" data-ok>Procesar</button>`;
  const modal = Modal.open({ title:'Recibir devolución', body, footer });
  modal.querySelector('[data-cancel]').onclick = () => Modal.close();
  modal.querySelector('[data-ok]').onclick = () => {
    let totalMerma = 0, totalDevuelto = 0;
    modal.querySelectorAll('.dev-input').forEach(inp => {
      const idx = Number(inp.dataset.idx);
      const l = evt.lineas[idx];
      const cantDev = Math.min(Number(inp.value)||0, l.cantidad);
      const p = findProd(l.idProducto);
      if(!p) return;
      if(cantDev > 0){
        const antes = Number(p.stock);
        p.stock = antes + cantDev;
        totalDevuelto += cantDev;
        addMovement({ idProducto: p.id, tipo: 'Entrada', cantidad: cantDev, stockAntes: antes, stockDespues: p.stock, motivo: 'Devolución: ' + evt.cliente, referencia: evt.id });
      }
      totalMerma += (l.cantidad - cantDev);
    });
    evt.estado = 'Finalizado';
    persist(); Modal.close();
    const msg = totalMerma > 0 ? `Devolución: ${totalDevuelto} devueltas, ${totalMerma} merma` : `Devolución: ${totalDevuelto} unidades reingresadas`;
    toast(msg, totalMerma > 0 ? 'warning' : 'success', 4500);
    renderEventoDetalle(id);
  };
}

/* ============ MOVIMIENTOS ============ */
function renderMovimientos(){
  const list = state.movements.filter(m => !state.moveFilter || m.tipo === state.moveFilter);
  const sorted = [...list].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

  $('view-movimientos').innerHTML = `
    <div class="card">
      <div class="card-header">
        <h3>Kardex (${list.length})</h3>
        <div class="header-actions">
          <select onchange="App.filterMovements(this.value)">
            <option value="">Todos</option>
            <option value="Entrada" ${state.moveFilter==='Entrada'?'selected':''}>Entradas</option>
            <option value="Salida" ${state.moveFilter==='Salida'?'selected':''}>Salidas</option>
          </select>
        </div>
      </div>
      <div class="card-body">
        ${sorted.length === 0
          ? '<div class="empty-state"><div class="empty-icon">🔄</div><p>Sin movimientos</p></div>'
          : renderMovementsTable(sorted)}
      </div>
    </div>
  `;
}

function renderMovementsTable(list){
  return `
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Stock</th><th>Motivo</th></tr></thead>
        <tbody>
          ${list.map(m => {
            const p = findProd(m.idProducto);
            return `<tr>
              <td class="muted-sm">${fmtDateTime(m.fecha)}</td>
              <td>${p ? p.nombre : m.idProducto}</td>
              <td><span class="badge ${m.tipo==='Entrada'?'badge-success':m.tipo==='Salida'?'badge-warning':'badge-info'}">${m.tipo}</span></td>
              <td><strong>${m.cantidad}</strong></td>
              <td>${m.stockAntes}→${m.stockDespues}</td>
              <td class="muted-sm">${m.motivo || '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ============ APP ============ */
const App = {
  login(){
    $('login-view').style.display = 'none';
    $('app-view').classList.add('active');
    const data = Store.load();
    state.products = data.products;
    state.events = data.events;
    state.movements = data.movements;
    document.querySelectorAll('.nav-item').forEach(n => { n.onclick = () => navigate(n.dataset.view); });
    navigate('dashboard');
  },
  logout(){
    $('app-view').classList.remove('active');
    $('login-view').style.display = 'flex';
    App.closeSidebar();
  },
  toggleSidebar(){
    const sb = $('sidebar');
    const bd = $('sidebar-backdrop');
    if(sb.classList.contains('open')) App.closeSidebar();
    else { sb.classList.add('open'); bd.classList.add('active'); }
  },
  closeSidebar(){
    $('sidebar').classList.remove('open');
    $('sidebar-backdrop').classList.remove('active');
  },
  resetDemo(){
    if(!confirm('¿Restablecer los datos de la demo?')) return;
    Store.reset();
    const data = Store.load();
    state.products = data.products;
    state.events = data.events;
    state.movements = data.movements;
    toast('Demo restablecida','success');
    navigate('dashboard');
  },
  searchProducts(v){ state.productSearch = v; renderProductos(); },
  openProductForm,
  confirmDeleteProduct,
  filterEvents(v){ state.eventFilter = v; renderEventos(); },
  openEventForm,
  viewEvent,
  viewEventList(){ navigate('eventos'); },
  despacharEvento,
  openDevolucion,
  filterMovements(v){ state.moveFilter = v; renderMovimientos(); }
};

console.log('✅ Metro Cuadrado Demo v3.0 (responsive)');
